name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - claude/check-storybook-access-8XZBw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Angular app
        run: npx ng build --configuration production --base-href "/storybook-test/"

      - name: Make SPA fallback
        run: cp dist/prototype-app/browser/index.html dist/prototype-app/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/prototype-app/browser

      - id: deployment
        uses: actions/deploy-pages@v4
